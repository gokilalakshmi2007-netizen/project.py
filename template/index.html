{%extends "master.html"%}
{% block title %}Home{% endblock %}
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
        color: #111;
    }
    .navbar {
        display: flex;
        gap: 15px;
        padding: 20px 5%;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
    }
    .navbar a {
        text-decoration: none;
        color: #333;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        transition: 0.2s;
    }
    .navbar a:hover {
        background: #f0f0f0;
    }
    .hero {
        text-align: center;
        padding: 80px 20px;
    }
    .hero h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        font-weight: 600;
    }
    .hero p {
        font-size: 1.2rem;
        color: #555;
        margin-bottom: 30px;
    }
    .hero img {
        width: 100%;
        max-width: 800px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .hero .btn {
        display: inline-block;
        background: #000;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 40px;
    }
    .hero .btn:hover {
        background: #333;
    }
</style>

<div class="navbar">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'products' %}">Products</a>
    <a href="{% url 'login' %}">Login</a>
</div>

<div class="hero">
    <h1>Welcome to Our Store</h1>
    <p>The simplest way to buy what you love.</p>
    <a href="{% url 'products' %}" class="btn">View Products</a>
    <br>
    <img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1200&q=80" alt="Store Image">
</div>
{% endblock %}
