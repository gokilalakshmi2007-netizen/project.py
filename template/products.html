{%extends "master.html"%}
{% block title %}Products{% endblock %}
{% block content %}  
<style>
    .products-container {
        padding: 4rem 10%;
        max-width: 1400px;
        margin: 0 auto;
    }
    .products-header {
        text-align: center;
        margin-bottom: 4rem;
    }
    .products-header h1 {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        background: linear-gradient(to right, #fff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
    }
    .products-header p {
        font-size: 1.25rem;
        color: var(--text-muted);
        font-weight: 300;
    }
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2.5rem;
    }
    .product-card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 30px;
        transition: all 0.4s ease;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .product-card:hover {
        transform: translateY(-12px);
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(99, 102, 241, 0.1);
    }
    .product-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .product-info {
        padding: 1.8rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }
    .product-title {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }
    .product-price {
        font-size: 1.5rem;
        color: var(--primary);
        font-weight: 800;
        margin-bottom: 1.5rem;
        margin-top: auto;
    }
    .btn-cart {
        display: block;
        width: 100%;
        padding: 14px;
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary);
        text-align: center;
        text-decoration: none;
        border-radius: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        border: 1px solid rgba(99, 102, 241, 0.3);
        cursor: pointer;
        font-size: 1.1rem;
    }
    .btn-cart:hover {
        background: var(--primary);
        color: white;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
    }
</style>

<div class="products-container">
    {% csrf_token %}
    <div class="products-header">
        <h1>Our Premium Collection</h1>
        <p>Handpicked electronics for the tech-savvy.</p>
    </div>
    <div class="products-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Wireless Headphones</h3>
                <div class="product-price">$299.99</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Smart Watch</h3>
                <div class="product-price">$199.50</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=600&q=80" alt="Mechanical Keyboard" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Mechanical Keyboard</h3>
                <div class="product-price">$149.00</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?auto=format&fit=crop&w=600&q=80" alt="Laptop Stand" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Premium Laptop Stand</h3>
                <div class="product-price">$49.99</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
