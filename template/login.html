{%extends "master.html"%}
{% block title %}Login{% endblock %}
{% block content %}   
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
        color: #111;
    }
    .navbar {
        display: flex;
        gap: 15px;
        padding: 20px 5%;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
    }
    .navbar a {
        text-decoration: none;
        color: #333;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        transition: 0.2s;
    }
    .navbar a:hover {
        background: #f0f0f0;
    }
    .login-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 40px 20px;
        text-align: center;
        border: 1px solid #eaeaea;
        border-radius: 16px;
    }
    .login-container h1 {
        margin-bottom: 30px;
        font-size: 2rem;
    }
    .login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
    }
    .login-container button {
        width: 100%;
        padding: 12px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }
    .login-container button:hover {
        background: #333;
    }
    .login-img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 20px;
        height: 150px;
        object-fit: cover;
    }
</style>

<div class="navbar">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'products' %}">Products</a>
    <a href="{% url 'login' %}">Login</a>
</div>

<div class="login-container">
    {% csrf_token %}
    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80" alt="Login Image" class="login-img">
    <h1>Login</h1>
    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="button">Sign In</button>
    </form>
</div>
{% endblock %}
