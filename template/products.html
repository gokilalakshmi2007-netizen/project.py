{%extends "master.html"%}
{% block title %}Products{% endblock %}
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
        color: #111;
    }
    .navbar {
        display: flex;
        gap: 15px;
        padding: 20px 5%;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
    }
    .navbar a {
        text-decoration: none;
        color: #333;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        transition: 0.2s;
    }
    .navbar a:hover {
        background: #f0f0f0;
    }
    .products-container {
        padding: 60px 5%;
        max-width: 1200px;
        margin: 0 auto;
    }
    .products-container h1 {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 40px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
    }
    .card {
        border: 1px solid #eaeaea;
        border-radius: 12px;
        overflow: hidden;
        text-align: center;
        transition: 0.3s;
    }
    .card:hover {
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    .card h3 {
        margin: 15px 0 5px;
        font-size: 1.2rem;
    }
    .card p {
        color: #555;
        margin-bottom: 15px;
        font-weight: 600;
    }
</style>

<div class="navbar">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'products' %}">Products</a>
    <a href="{% url 'login' %}">Login</a>
</div>

<div class="products-container">
    {% csrf_token %}
    <h1>Our Products</h1>
    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones">
            <h3>Wireless Headphones</h3>
            <p>$299.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>$199.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=600&q=80" alt="Keyboard">
            <h3>Mechanical Keyboard</h3>
            <p>$149.00</p>
        </div>
    </div>
</div>
{% endblock %}
