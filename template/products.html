{%extends "master.html"%}
{% block title %}Products{% endblock %}
{% block content %}  
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    body {
        font-family: 'Poppins', sans-serif;
        background: #f8f9fa;
        margin: 0;
        padding: 0;
        color: #333;
    }
    body > a {
        display: inline-block;
        margin: 20px 10px 0 20px;
        padding: 10px 20px;
        text-decoration: none;
        color: #2d3436;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        border-radius: 30px;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
    }
    body > a:hover {
        background: #ff4757;
        color: white;
        transform: translateY(-2px);
    }
    .products-container {
        padding: 4rem 10%;
        max-width: 1400px;
        margin: 0 auto;
    }
    .products-header {
        text-align: center;
        margin-bottom: 4rem;
    }
    .products-header h1 {
        font-size: 3rem;
        color: #2d3436;
        margin-bottom: 1rem;
    }
    .products-header p {
        font-size: 1.1rem;
        color: #636e72;
    }
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2.5rem;
    }
    .product-card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        display: flex;
        flex-direction: column;
    }
    .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    .product-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }
    .product-info {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }
    .product-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #2d3436;
    }
    .product-price {
        font-size: 1.4rem;
        color: #ff4757;
        font-weight: 700;
        margin-bottom: 1.5rem;
        margin-top: auto;
    }
    .btn-cart {
        display: block;
        width: 100%;
        padding: 12px;
        background: #2d3436;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: background 0.3s;
        border: none;
        cursor: pointer;
        font-size: 1rem;
    }
    .btn-cart:hover {
        background: #ff4757;
    }
</style>

<div class="products-container">
    {% csrf_token %}
    <div class="products-header">
        <h1>Our Premium Collection</h1>
        <p>Handpicked electronics for the tech-savvy.</p>
    </div>
    <div class="products-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Wireless Headphones</h3>
                <div class="product-price">$299.99</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Smart Watch" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Smart Watch</h3>
                <div class="product-price">$199.50</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=600&q=80" alt="Mechanical Keyboard" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Mechanical Keyboard</h3>
                <div class="product-price">$149.00</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?auto=format&fit=crop&w=600&q=80" alt="Laptop Stand" class="product-img">
            <div class="product-info">
                <h3 class="product-title">Premium Laptop Stand</h3>
                <div class="product-price">$49.99</div>
                <button class="btn-cart">Add to Cart</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
