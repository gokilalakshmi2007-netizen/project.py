{%extends "master.html"%}
{% block title %}About Us{% endblock %}
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
        color: #111;
    }
    .navbar {
        display: flex;
        gap: 15px;
        padding: 20px 5%;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
    }
    .navbar a {
        text-decoration: none;
        color: #333;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        transition: 0.2s;
    }
    .navbar a:hover {
        background: #f0f0f0;
    }
    .about-container {
        max-width: 800px;
        margin: 60px auto;
        padding: 0 20px;
        text-align: center;
    }
    .about-container h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
    }
    .about-container p {
        font-size: 1.1rem;
        color: #555;
        line-height: 1.6;
        margin-bottom: 40px;
    }
    .about-img {
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
</style>

<div class="navbar">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'products' %}">Products</a>
    <a href="{% url 'login' %}">Login</a>
</div>

<div class="about-container">
    <h1>About Us</h1>
    <p>We believe in keeping things simple. Our mission is to provide you with the best products without the clutter. Just pure, clean design and high-quality items.</p>
    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" alt="About Us" class="about-img">
</div>
{% endblock %}
