{%extends "master.html"%}
{% block title %}Login{% endblock %}
{% block content %}   
<style>
    /* Specific overrides for login page to have a full bg image */
    body {
        background: linear-gradient(135deg, rgba(15,23,42,0.8) 0%, rgba(30,41,59,0.95) 100%), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
        background-blend-mode: overlay;
    }
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 80px);
        padding: 2rem;
    }
    .login-container {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 4rem 3.5rem;
        border-radius: 35px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 450px;
        text-align: center;
    }
    .login-container h1 {
        margin-bottom: 2.5rem;
        color: var(--text-main);
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(to right, #fff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .form-group {
        margin-bottom: 1.8rem;
        text-align: left;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        font-size: 1.05rem;
    }
    .form-group input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-main);
        border-radius: 16px;
        font-size: 1.05rem;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
    }
    .form-group input:focus {
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.8);
        outline: none;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .form-group input::placeholder {
        color: #475569;
    }
    .btn-login {
        width: 100%;
        padding: 16px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 16px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        margin-top: 1rem;
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    .btn-login:hover {
        background: var(--primary-hover);
        transform: translateY(-3px);
        box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
    }
</style>

<div class="login-wrapper">
    <div class="login-container">
        {% csrf_token %}
        <h1>Welcome Back</h1>
        <form>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>
            <button type="button" class="btn-login">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
