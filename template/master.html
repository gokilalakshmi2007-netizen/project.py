<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Shop Master Template</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; align-items: center; padding: 2rem; }
        nav { background: var(--card-bg); padding: 1rem 2rem; border-radius: 99px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 2rem; display: flex; gap: 1.5rem; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }
        .container { background: var(--card-bg); padding: 3rem; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); text-align: center; width: 100%; animation: fadeIn 0.5s ease-out; }
        .container.small { max-width: 400px; }
        .container.medium { max-width: 600px; }
        .container.large { max-width: 800px; }
        h1 { font-size: 2.5rem; color: var(--text-main); margin-bottom: 1rem; }
        p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; }
        .btn { display: inline-block; background: var(--primary); color: white; padding: 0.75rem 2rem; border-radius: 99px; text-decoration: none; font-weight: 600; transition: background 0.3s, transform 0.2s; border: none; cursor: pointer; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn.full { width: 100%; border-radius: 8px; margin-top: 1rem; }
        .btn.small { padding: 0.5rem 1rem; border-radius: 8px; text-align: center; width: 100%; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; text-align: left; }
        .product-card { background: var(--bg); padding: 1.5rem; border-radius: 16px; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card h3 { margin-bottom: 0.5rem; font-size: 1.2rem; }
        .product-price { color: var(--primary); font-weight: 700; font-size: 1.3rem; margin-bottom: 1rem; }
        form { display: flex; flex-direction: column; gap: 1.5rem; text-align: left; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 500; color: var(--text-main); }
        input { padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
    </nav>
    <div class="container medium">
        <!-- PUT YOUR CONTENT HERE -->
        <h1>Master Template</h1>
        <p>This is a master file that you can copy to create new pages easily.</p>
    </div>
</body>
</html>
